# Bei jedem Push: Typen, Unit-Tests, Server-Tests, Build und E2E (iPhone-Breite).
# Deploy nur aus main und nur, wenn alles grün ist (und das Cloudflare-Token als Secret hinterlegt ist).
name: Tests und Deploy

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Ohne Cloudflare-Token kein Deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Kein CLOUDFLARE_API_TOKEN hinterlegt, Deploy übersprungen (siehe FUER-JONAH.md)."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci && npm ci --prefix server
      - name: Server (Worker) deployen
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --prefix server wrangler deploy --config server/wrangler.toml --env production
      - name: App bauen und auf Cloudflare Pages deployen
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run build && npx --prefix server wrangler pages deploy dist --project-name "${{ vars.PAGES_PROJECT || 'app' }}" --branch main
