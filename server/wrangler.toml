# Cloudflare Worker (Server der App). Hier stehen keine Geheimnisse: Schlüssel liegen nur als Cloudflare-Secrets vor.
#
# Oben: die echte App mit neutralen Namen (hängen nicht vom App-Namen ab, siehe scripts/release.md).
#   Alte App bis zum Aufräumen: Worker "ironman-coach-api", D1 "ironman" (f09acda6-8ded-4b02-a17c-c89aa4480ce9).
# [env.test]: die Test-Umgebung mit eigener Datenbank. Deploy: node scripts/deploy.mjs test
name = "coach-api-efc7"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "coach-db-efc7"
database_id = "42d4e471-2ad6-41da-8865-09bbb1d26a38"
migrations_dir = "migrations"

# Auftrag 16: kostenlose KI (Workers AI), kein Schlüssel nötig; Gratis-Kontingent 10.000 Neurons pro Tag
[ai]
binding = "AI"

[triggers]
# Zeiten in UTC. Der Code prüft selbst die Uhrzeit in Europe/Berlin.
crons = ["*/5 * * * *"]

[vars]
ALLOWED_ORIGINS = "https://coach-app-efc7.pages.dev"
PUBLIC_URL = "https://coach-app-efc7.pages.dev"
ENVIRONMENT = "production"

# ---------------- Test-Umgebung ----------------
[env.test]
name = "stamio-api-test"
workers_dev = false
preview_urls = false

[[env.test.d1_databases]]
binding = "DB"
database_name = "stamio-test"
database_id = "f5a7a245-1fcf-49bd-b29d-4587c69a35cf"
migrations_dir = "migrations"

[env.test.ai]
binding = "AI"

[env.test.triggers]
crons = ["*/5 * * * *"]

[env.test.vars]
ALLOWED_ORIGINS = "https://stamio-test.pages.dev"
PUBLIC_URL = "https://stamio-test.pages.dev"
ENVIRONMENT = "test"
# Test-Umgebung: mehr neue Konten pro Tag und Adresse (Prüfungen), echte App: 3
SIGNUP_PER_IP = "50"
# Auftrag 16: Test und echte App teilen sich das Gratis-Kontingent von Workers AI (10.000 Neurons/Tag) – die Test-Umgebung nimmt höchstens 1.500
WAI_DAILY_NEURONS = "1500"
