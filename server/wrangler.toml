# Cloudflare Worker für Ironman Coach.
# Hier stehen keine Geheimnisse. Schlüssel liegen nur als Cloudflare-Secrets vor (wrangler secret put …).
name = "ironman-coach-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "ironman"
database_id = "00000000-0000-0000-0000-000000000000"

[triggers]
# Zeiten in UTC. Der Code prüft selbst die Uhrzeit in Europe/Berlin.
crons = ["0 2 * * *"]

[vars]
ALLOWED_ORIGINS = "https://jonahkreibich-png.github.io,http://localhost:8765"
