<!doctype html>
<!-- Nur für die alte Adresse (GitHub Pages aus main). Die App selbst liegt in web/ und läuft auf https://coach-app-efc7.pages.dev -->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Die App ist umgezogen</title>
  <meta http-equiv="refresh" content="3; url=https://coach-app-efc7.pages.dev/">
  <link rel="canonical" href="https://coach-app-efc7.pages.dev/">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef1f4; color: #1d2733;
           font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; padding: 0 16px; }
    a { color: #0b63c5; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Die App ist umgezogen</h1>
    <p>Neue Adresse: <a href="https://coach-app-efc7.pages.dev/">coach-app-efc7.pages.dev</a></p>
    <p>Du wirst gleich weitergeleitet. Leg dir die neue Adresse in Safari über Teilen → „Zum Home-Bildschirm“ an.</p>
  </main>
  <script>
    // Alten Offline-Speicher dieser Adresse aufräumen, damit das alte Icon nicht die alte App aus dem Cache zeigt.
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
    if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
    setTimeout(() => location.replace('https://coach-app-efc7.pages.dev/'), 1500);
  </script>
</body>
</html>
