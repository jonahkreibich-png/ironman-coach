<script>

</script>
</head>
<body>
<header class="appbar">
  <div class="appbar-in">
    <div class="clock" id="clock"></div>
    <button class="icon-btn" data-act="export-open" aria-label="Für den Chat exportieren" title="Für den Chat exportieren">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M8 5H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-2M9 12h6M9 16h4"/></svg>
    </button>
    <button class="icon-btn" data-act="settings-open" aria-label="Einstellungen" title="Einstellungen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M18 7h2M4 17h3M11 17h9"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="8.5" cy="17" r="2.3"/></svg>
    </button>
  </div>
  <div class="lane" aria-hidden="true"></div>
</header>

<main id="app"></main>

<nav class="tabbar" aria-label="Bereiche">
  <div class="tabbar-in">
    <button class="tab" data-go="heute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>Heute</button>
    <button class="tab" data-go="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Plan</button>
    <button class="tab" data-go="werte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12.5h4l2.2-5.5 4 11 2.3-5.5H21"/></svg>Werte</button>
    <button class="tab" data-go="fortschritt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18l5-5.5 4 3L20 7M15 7h5v5"/></svg>Fortschritt</button>
    <button class="tab" data-go="essen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12h17a8.5 8.5 0 0 1-17 0zM8.5 8c0-1.8 1.8-2 1.8-4M13.5 8c0-1.8 1.8-2 1.8-4"/></svg>Essen</button>
  </div>
</nav>

<div id="sheet" class="sheet-wrap" hidden>
  <div class="sheet-bg" data-act="sheet-close"></div>
  <div class="sheet" role="dialog" aria-modal="true" id="sheetPanel"></div>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<noscript><p style="padding:16px">%APP_NAME% braucht JavaScript.</p></noscript>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
